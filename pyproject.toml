[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-lab"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "statsmodels",
    "river",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]